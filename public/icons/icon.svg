<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Emerald-Cyan Accent Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Subtle Glow Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.8" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#06B6D4" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer Glow Border -->
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#brandGrad)" stroke-width="6" stroke-opacity="0.6" />

  <!-- Code Bracket Left -->
  <path d="M 130 180 L 70 256 L 130 332" fill="none" stroke="url(#brandGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" filter="url(#softShadow)" />

  <!-- Code Bracket Right -->
  <path d="M 382 180 L 442 256 L 382 332" fill="none" stroke="url(#brandGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" filter="url(#softShadow)" />

  <!-- Monogram KH -->
  <g filter="url(#softShadow)">
    <!-- Letter K -->
    <path d="M 175 160 L 175 352" stroke="url(#brandGrad)" stroke-width="26" stroke-linecap="round" />
    <path d="M 265 170 L 180 256 L 265 342" fill="none" stroke="url(#brandGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Letter H -->
    <path d="M 285 160 L 285 352" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" />
    <path d="M 285 256 L 345 256" stroke="url(#brandGrad)" stroke-width="24" stroke-linecap="round" />
    <path d="M 345 160 L 345 352" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" />
  </g>

  <!-- Small accent indicator dot (Active status) -->
  <circle cx="256" cy="410" r="10" fill="#10B981" filter="url(#glow)" />
  <circle cx="256" cy="410" r="5" fill="#FFFFFF" />
</svg>
