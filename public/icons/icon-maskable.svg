<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="mBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="mBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="mSoftShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#06B6D4" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Full bleed background for maskable safe area -->
  <rect width="512" height="512" fill="url(#mBgGrad)" />

  <!-- Centered Inner Safe Zone Graphics (within 80% circle safe area) -->
  <g transform="translate(51.2, 51.2) scale(0.8)">
    <!-- Code Bracket Left -->
    <path d="M 130 180 L 70 256 L 130 332" fill="none" stroke="url(#mBrandGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" filter="url(#mSoftShadow)" />

    <!-- Code Bracket Right -->
    <path d="M 382 180 L 442 256 L 382 332" fill="none" stroke="url(#mBrandGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" filter="url(#mSoftShadow)" />

    <!-- Monogram KH -->
    <g filter="url(#mSoftShadow)">
      <!-- Letter K -->
      <path d="M 175 160 L 175 352" stroke="url(#mBrandGrad)" stroke-width="26" stroke-linecap="round" />
      <path d="M 265 170 L 180 256 L 265 342" fill="none" stroke="url(#mBrandGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- Letter H -->
      <path d="M 285 160 L 285 352" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" />
      <path d="M 285 256 L 345 256" stroke="url(#mBrandGrad)" stroke-width="24" stroke-linecap="round" />
      <path d="M 345 160 L 345 352" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" />
    </g>

    <!-- Indicator Dot -->
    <circle cx="256" cy="405" r="9" fill="#10B981" />
    <circle cx="256" cy="405" r="4.5" fill="#FFFFFF" />
  </g>
</svg>
